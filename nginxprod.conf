events {
    worker_connections 1024;
}

http {
    # Replace your manual 'types' block with this standard include
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80; # Standard HTTP port for production
        server_name localhost;

        # 1. Frontend: Serve static files built by Svelte/Vite
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html; # Critical for SvelteKit/SPA routing
        }

        # 2. API requests -> backend (Bun/Hono)
        location /api/ {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. WebSockets (Chat functionality)
        location /ws/ {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;

            # Keep chat connections alive
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
