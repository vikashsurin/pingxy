events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Optimize for large file uploads if needed
    client_max_body_size 20M;

    # Use a 'map' for more robust WebSocket handling
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name localhost;

        # 1. Frontend (SvelteKit)
        location / {
            proxy_pass http://frontend:3001;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Ensure query strings (like ?/login) are passed correctly
            proxy_pass_request_headers on;
        }

        # 2. API requests -> backend (Bun/Hono)
        # We use 'location /api' without the trailing slash for flexibility
        location /api {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2.1 Storage
        location /storage/ {
            proxy_pass http://storage:9000/pingxy/;
            proxy_set_header Host $host;
        }   

        # 3. WebSockets (Real-time Chat)
        location /ws {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;

            # Extended timeouts for persistent chat connections
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # For development
        # SvelteKit Hot Module Replacement (HMR)
        location /_svelte_kit_hmr {
            proxy_pass http://frontend:3001/_svelte_kit_hmr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
