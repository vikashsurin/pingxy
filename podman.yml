services:
  # --- 1. THE DATABASE ---
  postgres:
    image: postgres:16-alpine
    container_name: pingxy-postgres-dev
    shm_size: "512mb"
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-pingxy}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-pingxy}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- 2. THE MIGRATOR (Runs once) ---
  migration:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: development
    container_name: pingxy-migration-dev
    restart: "no"
    environment:
      # In a Pod, we use localhost to talk to Postgres
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@localhost:5432/${DB_NAME:-pingxy}
    volumes:
      - ./apps/backend:/app/apps/backend:Z
      - ./packages/shared:/app/packages/shared:Z
      - ./apps/backend/drizzle:/app/drizzle:Z
      - ./apps/backend/drizzle.config.ts:/app/drizzle.config.ts:Z
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bun", "run", "db:migrate"]

  # --- 3. THE BACKEND ---
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: development
    container_name: pingxy-backend-dev
    restart: always
    volumes:
      - ./apps/backend:/app/apps/backend:Z
      - ./packages/shared:/app/packages/shared:Z
      - /app/node_modules
      - /app/apps/backend/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@localhost:5432/${DB_NAME:-pingxy}
      - STORAGE_ENDPOINT=http://localhost:9000
      - STORAGE_PUBLIC_ENDPOINT=http://localhost/storage
      - S3_ACCESS_KEY=pingxy_admin
      - S3_SECRET_KEY=super_secret_password_123
      - S3_BUCKET=pingxy
      - S3_REGION=us-east-1
    depends_on:
      migration:
        condition: service_completed_successfully
      storage:
        condition: service_healthy
    command: ["bun", "--hot", "run", "src/index.ts"]

  # --- 4. THE FRONTEND ---
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: development
    container_name: pingxy-frontend-dev
    restart: always
    volumes:
      - ./apps/frontend:/app/apps/frontend:Z
      - ./packages/shared:/app/packages/shared:Z
      - /app/node_modules
      - /app/apps/frontend/node_modules
    environment:
      - NODE_ENV=development
      - PORT=5173
      - INTERNAL_BACKEND_URL=http://localhost:3000
    command: ["bun", "run", "dev", "--host"]

  # --- 5. THE STORAGE (MinIO) ---
  storage:
    image: minio/minio
    container_name: pingxy-storage-dev
    restart: always
    environment:
      - MINIO_ROOT_USER=pingxy_admin
      - MINIO_ROOT_PASSWORD=super_secret_password_123
    volumes:
      - minio_data_dev:/data:Z
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- 6. THE GATEWAY (Caddy) ---
  gateway:
    image: caddy:alpine
    container_name: pingxy-gateway-dev
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 Support
      - "9001:9001"   # Access MinIO Console directly
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:Z
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

# --- VOLUME DEFINITIONS ---
volumes:
  postgres_data_dev:
  minio_data_dev:
  caddy_data:
  caddy_config:
