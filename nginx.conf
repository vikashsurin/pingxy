worker_processes auto;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Optimization & Security ---
    client_max_body_size 20M;
    server_tokens off; # Hides Nginx version for security

    # Gzip compression to speed up Svelte frontend loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_proxied any;
    gzip_min_length 1000;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    keepalive_timeout 65;
    keepalive_requests 1000;

    # 1. Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name pingxy.com www.pingxy.com;
        return 301 https://$host$request_uri;
    }

    # 2. Main Production Server (HTTPS)
    server {
        listen 443 ssl;
        http2 on; # Enable HTTP/2 for better performance
        server_name pingxy.com www.pingxy.com;

        # SSL Certificates (Managed via Certbot or similar)
        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # Basic Cloudflare Security Optimization
        ssl_protocols TLSv1.2 TLSv1.3;

        # Trust Cloudflare's IP addresses
        set_real_ip_from 103.21.244.0/22;
        set_real_ip_from 103.22.200.0/22;

        real_ip_header CF-Connecting-IP;

        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";

        # --- Frontend (SvelteKit) ---
        location / {
            proxy_pass http://frontend:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- API requests (Bun/Hono) ---
        location /api {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- WebSockets (Real-time Chat) ---
        location /ws {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
