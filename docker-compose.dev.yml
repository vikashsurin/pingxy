services:
  redis:
      image: redis:7-alpine
      container_name: pingxy-redis
      networks:
        - pingxy-network-dev
      restart: always
      ports:
        - "6379:6379"
      volumes:
        - redis_data:/data
      command: ["redis-server", "--appendonly", "yes"]

  postgres:
    image: postgres:16-alpine
    shm_size: "512mb"
    container_name: pingxy-postgres-dev
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-pingxy}
    ports:
      - "5432:5432" # Expose for local tools
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - pingxy-network-dev
    deploy:
      resources:
        limits:
          memory: 512M # Less than prod
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-pingxy}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  migration:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: development
    container_name: pingxy-migration-dev
    restart: no
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-pingxy}
    volumes:
      - ./apps/backend:/app/apps/backend
      - ./packages/shared:/app/packages/shared
      - ./apps/backend/drizzle:/app/drizzle
      - ./apps/backend/drizzle.config.ts:/app/drizzle.config.ts
    networks:
      - pingxy-network-dev
    depends_on:
      postgres:
        condition: service_healthy
    command: [ "bun", "run", "db:migrate" ]

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: development
    container_name: pingxy-backend-dev
    restart: always
    ports:
      - "3000:3000" # Expose for testing
    volumes:
      - ./apps/backend:/app/apps/backend
      - ./packages/shared:/app/packages/shared
      - /app/node_modules
      - /app/apps/backend/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-pingxy}
      - MINIO_ROOT_USER=pingxy_admin
      - MINIO_ROOT_PASSWORD=super_secret_password_123
      - STORAGE_ENDPOINT=http://storage:9000
      - STORAGE_PUBLIC_ENDPOINT=http://localhost:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - S3_BUCKET=pingxy
      - S3_REGION=us-east-1
      - REDIS_URL=redis://redis:6379
    networks:
      - pingxy-network-dev
    depends_on:
      migration:
        condition: service_completed_successfully
      storage:
        condition: service_healthy
      redis:
        condition: service_started

      # moderation:
      #   condition: service_healthy
    command: [ "bun", "--hot", "run", "src/index.ts" ]

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: development
    container_name: pingxy-frontend-dev
    restart: always
    ports:
      - "5173:5173" # Vite dev server
    volumes:
      - ./apps/frontend:/app/apps/frontend
      - ./packages/shared:/app/packages/shared
      - /app/node_modules
      - /app/apps/frontend/node_modules
    environment:
      - NODE_ENV=development
      - PORT=5173
      - INTERNAL_BACKEND_URL=http://backend:3000
      - HOST=0.0.0.0 # Ensure Vite binds to all interfaces
    networks:
      - pingxy-network-dev
    command: [ "bun", "run", "dev", "--", "--host", "0.0.0.0" ]

  caddy:
    image: caddy:alpine
    container_name: pingxy-proxy-dev
    restart: always
    ports:
      - "80:80"
    networks:
      - pingxy-network-dev
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - frontend
      - backend
  # moderation:
  #   build: ./moderation
  #   # environment:
  #   # - USE_ONNX=true  # lighter memory on your 4GB server # for production
  #   ports:
  #     - '8000:8000'
  #   restart: unless-stopped
  #   networks:
  #     - pingxy-network-dev
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
  #     interval: 15s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 60s

  storage:
    image: minio/minio
    container_name: pingxy-storage-dev
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - pingxy-network-dev
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data_dev:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

networks:
  pingxy-network-dev:
    driver: bridge

volumes:
  postgres_data_dev:
  minio_data_dev:
  redis_data:
